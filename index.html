<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, World!</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f1ea; color: #252b24; font-family: system-ui, sans-serif; }
main { width: min(100%, 680px); }
.label { color: #607453; font-size: 13px; font-weight: 600; letter-spacing: .16em; }
h1 { margin: 24px 0; font-size: clamp(48px, 10vw, 88px); line-height: 1.05; letter-spacing: -.06em; }
p { color: #65695f; font-size: 19px; line-height: 1.6; }
button { margin-top: 20px; padding: 15px 24px; border: 0; border-radius: 100px; background: #344c31; color: white; font: inherit; cursor: pointer; }
button:hover { background: #243b22; }
button:focus-visible { outline: 3px solid #a2af65; outline-offset: 5px; }
#greeting { min-height: 2em; margin-top: 24px; font-size: 16px; }
</style>
</head>
<body>
<main>
<span class="label">МОЯ ПЕРВАЯ СТРАНИЦА</span>
<h1>Hello, World!</h1>
<p>Всё начинается с простого приветствия.<br>Добро пожаловать на маленькую страницу больших идей.</p>
<button type="button" id="hello">Сказать привет ↗</button>
<p id="greeting" role="status"></p>
</main>
<script>
document.getElementById('hello').addEventListener('click', () => {
  document.getElementById('greeting').textContent = 'Привет! Рад тебя видеть 👋';
});
</script>
</body>
</html>
